name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build native helpers and Raycast extension
        run: |
          mkdir -p "$HOME/.config/raycast/extensions"
          npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run verify:native
      - run: npm run verify:store
      - run: npm run build:privileged
      - run: npm run package:companion-source
      - run: npm run lint:companion
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-companion-${{ github.sha }}
          path: dist/companion/*.zip
          if-no-files-found: error
          retention-days: 7
